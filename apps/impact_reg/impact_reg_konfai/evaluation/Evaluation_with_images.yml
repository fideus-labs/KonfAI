# konfai-apps eval APP --evaluation-file Evaluation_with_images.yml -i TRANSFORM --gt FIXED --gt MOVING [--mask MASK]
# The moving image, pulled onto the fixed grid through the registration (Volume_0), against the fixed one: the mean
# absolute error inside the mask, on the fixed grid (all of it when no mask is given).
Evaluator:
  metrics:
    FixedImage:
      targets_criterions:
        MovingImage;Mask:
          criterions_loader:
            MAESaveMap:
              reduction: mean
              dataset: ./Evaluations/ImpactReg/Output:mha
              group: MAE_map
  Dataset:
    groups_src:
      Reference_0:
        groups_dest:
          FixedImage:
            transforms:
              TensorCast:
                dtype: float32
      Reference_1:
        groups_dest:
          MovingImage:
            transforms:
              Resample:
                reference: '{case}'
                reference_group: Reference_0
                transforms:
                  Volume_0: false
                interpolation: linear
              TensorCast:
                dtype: float32
      Mask_0:
        groups_dest:
          Mask:
            transforms:
              TensorCast:
                dtype: uint8
    subset: None
    dataset_filenames:
    - ./Dataset:mha
    validation: None
  train_name: ImpactReg
