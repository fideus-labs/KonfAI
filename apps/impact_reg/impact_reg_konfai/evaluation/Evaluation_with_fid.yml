# konfai-apps eval APP --evaluation-file Evaluation_with_fid.yml -i TRANSFORM --gt FIXED_FID --gt MOVING_FID
# The target registration error: the fixed landmarks pushed through the registration (Volume_0), which maps the fixed
# grid into the moving image, against the moving landmarks, in mm. Landmarks pair by row: both files hold the same
# points, in the same order. No field is inverted.
Evaluator:
  metrics:
    FixedFid:
      targets_criterions:
        MovingFid:
          criterions_loader:
            TRE: {}
  Dataset:
    groups_src:
      Reference_0:
        groups_dest:
          FixedFid:
            transforms:
              TransformPoints:
                transforms:
                  Volume_0: false
      Reference_1:
        groups_dest:
          MovingFid:
            transforms: None
    subset: None
    dataset_filenames:
    - ./Dataset:mha
    validation: None
  train_name: ImpactReg
