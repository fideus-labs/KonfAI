[build-system]
requires = ["setuptools>=77", "wheel", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "mrsegmentator-konfai"
dynamic = ["version", "dependencies"]
description = "Fast and lightweight MRSegmentator CLI powered by the KonfAI framework."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"

authors = [
  { name = "Valentin Boussot", email = "boussot.v@gmail.com" }
]

[project.urls]
Homepage = "https://github.com/fideus-labs/KonfAI"
Repository = "https://github.com/fideus-labs/KonfAI"
Issues = "https://github.com/fideus-labs/KonfAI/issues"
License = "https://www.apache.org/licenses/LICENSE-2.0"

[project.scripts]
mrsegmentator-konfai = "mrsegmentator_konfai.cli:main"

[tool.setuptools_scm]
root = "../.."
tag_regex = "^v(?P<version>.*)$"
local_scheme = "no-local-version"

[tool.pytest.ini_options]
testpaths = ["tests"]
