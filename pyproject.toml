[build-system]
requires = ["setuptools>=68", "wheel", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "konfai"
dynamic = ["version"]
description = "A declarative execution engine for reproducible medical-imaging workflows"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"

authors = [
  { name = "Valentin Boussot", email = "boussot.v@gmail.com" }
]

keywords = ["deep learning", "medical imaging", "workflow", "streaming", "YAML", "PyTorch", "reproducibility"]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "torch",
  "tqdm",
  "numpy",
  "ruamel.yaml",
  "psutil",
  "lxml",
  "requests",
  "huggingface_hub"
]

[project.urls]
Homepage = "https://github.com/fideus-labs/KonfAI"
Repository = "https://github.com/fideus-labs/KonfAI"
Issues = "https://github.com/fideus-labs/KonfAI/issues"
License = "https://www.apache.org/licenses/LICENSE-2.0"

[project.scripts]
konfai = "konfai.main:main"
konfai-cluster = "konfai.main:cluster"

[project.optional-dependencies]
itk = ["SimpleITK"]
hdf5 = ["h5py"]
monitoring = ["nvidia-ml-py"]
tensorboard = ["tensorboard"]
imaging = ["SimpleITK", "h5py", "pydicom", "zarr", "ngff-zarr>=0.38", "dask"]
vtk = ["vtk"]
lpips = ["lpips"]
smp = ["segmentation-models-pytorch"]
ssim = ["scikit-image"]
fid = ["scipy", "torchvision"]
cluster = ["submitit"]
dicom = ["pydicom"]
omezarr = ["zarr", "ngff-zarr>=0.38", "dask"]
export = ["onnx", "onnxruntime", "onnxscript"]
all = [
  "konfai[itk]",
  "konfai[hdf5]",
  "konfai[monitoring]",
  "konfai[tensorboard]",
  "konfai[vtk]",
  "konfai[lpips]",
  "konfai[ssim]",
  "konfai[fid]",
  "konfai[cluster]",
  "konfai[dicom]",
  "konfai[omezarr]",
  "konfai[export]"
]
dev = [
  "SimpleITK",
  "h5py",
  "pydicom",
  "zarr",
  "ngff-zarr>=0.38",
  "dask",
  "scikit-image",
  "onnx",
  "onnxruntime",
  "onnxscript",
  "nvidia-ml-py",
  "tensorboard",
  "pytest",
  "pytest-cov",
  "pytest-xdist",
  "pre-commit",
  "ruff==0.15.2",
  "mypy",
  "build",
  "types-requests",
  "sphinx>=7.0",
  "shibuya",
  "myst-parser",
  "nbsphinx",
  "ipython",
  "ipykernel",
  "sphinx-autodoc-typehints",
  "sphinx-copybutton",
  "sphinx-togglebutton",
  "sphinx-tabs"
]

[tool.setuptools_scm]
tag_regex = "^v(?P<version>.*)$"
local_scheme = "no-local-version"

[tool.setuptools.packages.find]
# "konfai.*" (with the dot) keeps namespace subpackages such as konfai.models.* while NOT matching
# the sibling "konfai-apps" directory (hyphen), which the old "konfai*" glob wrongly bundled into the
# published wheel. Keep the default namespaces=true so PEP 420 packages (konfai/models) ship.
include = ["konfai", "konfai.*"]
exclude = ["apps*", "konfai-apps*"]

[tool.setuptools.package-data]
# Ship the declarative model catalog (konfai/models/yaml/*.yml) in the wheel.
"konfai.models.yaml" = ["*.yml"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]

[tool.pixi.pypi-dependencies]
konfai = { path = ".", editable = true }

[tool.pixi.dependencies]
python = ">=3.10,<3.14"
pip = "*"

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
lint = { features = ["lint"], no-default-feature = true, solve-group = "default" }
docs = { features = ["default", "docs"], solve-group = "default" }

# ---------------------------------------------------------------------------
# Feature: dev
# ---------------------------------------------------------------------------
[tool.pixi.feature.dev.pypi-dependencies]
pytest = "*"
pytest-cov = "*"
pytest-xdist = "*"
ruff = "==0.15.2"
build = "*"
twine = "*"
mypy = "*"
types-requests = "*"
submitit = "*"
SimpleITK = "*"
h5py = "*"
tensorboard = "*"
nvidia-ml-py = "*"
pydicom = "*"
zarr = "*"
ngff-zarr = ">=0.38"
dask = "*"
scikit-image = "*"

[tool.pixi.feature.dev.tasks]
test = { cmd = "pytest -q -n auto --dist loadfile tests/", description = "Run the test suite" }
test-fast = { cmd = 'pytest -q -m "not slow and not integration" tests/', description = "Run the test suite without slow oracle and integration tests" }
test-apps = { cmd = "pytest -q konfai-apps/tests", description = "Run the konfai-apps test suite" }
test-cov = { cmd = "pytest -n auto --dist loadfile --cov=konfai --cov-report=term-missing tests/", description = "Run tests with coverage" }
lint = { cmd = "ruff check konfai konfai-apps/konfai_apps konfai-mcp/konfai_mcp studio/konfai_studio tests", description = "Lint source code" }
format = { cmd = "ruff format konfai konfai-apps/konfai_apps konfai-mcp/konfai_mcp studio/konfai_studio tests", description = "Format source code" }
format-check = { cmd = "ruff format --check konfai konfai-apps/konfai_apps konfai-mcp/konfai_mcp studio/konfai_studio tests", description = "Check formatting without modifying files" }
typecheck = { cmd = "python -m mypy konfai konfai-apps/konfai_apps konfai-mcp/konfai_mcp studio/konfai_studio --ignore-missing-imports --no-site-packages", description = "Type-check all packages" }
build = { cmd = "python -m build", description = "Build sdist and wheel" }
check = { depends-on = ["lint", "format-check", "test", "test-apps"], description = "Run all quality checks" }

# ---------------------------------------------------------------------------
# Feature: lint
# ---------------------------------------------------------------------------
[tool.pixi.feature.lint.dependencies]
python = ">=3.10,<3.14"

[tool.pixi.feature.lint.pypi-dependencies]
ruff = "==0.15.2"
pre-commit = "*"

[tool.pixi.feature.lint.tasks]
pre-commit-install = { cmd = "pre-commit install --hook-type pre-commit --hook-type commit-msg", description = "Install pre-commit and commit-msg hooks" }
pre-commit-run = { cmd = "pre-commit run --all-files", description = "Run pre-commit hooks on all repository files" }

# ---------------------------------------------------------------------------
# Feature: docs
# ---------------------------------------------------------------------------
[tool.pixi.feature.docs.dependencies]
python = ">=3.10,<3.14"

[tool.pixi.feature.docs.pypi-dependencies]
sphinx = ">=7.0"
shibuya = "*"
myst-parser = "*"
sphinx-autodoc-typehints = "*"
sphinx-copybutton = "*"
sphinx-togglebutton = "*"
sphinx-tabs = "*"

[tool.pixi.feature.docs.tasks]
build-docs = { cmd = "make html", cwd = "docs", description = "Build Sphinx documentation" }
dev-docs = { cmd = "sphinx-autobuild docs/source docs/_build/html", description = "Live-reload docs during development" }

# ---------------------------------------------------------------------------
# Ruff (replaces black + flake8 + isort)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 120
src = ["konfai", "konfai-apps/konfai_apps"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "C4", "RUF"]
extend-ignore = ["E501", "B006", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: marks tests as slow (deselect with -m 'not slow')",
    "integration: marks integration tests",
]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
# No `python_version`: mypy analyses as the interpreter it runs on, which is the only version whose
# stubs are installed. Pinning it to the floor of `requires-python` makes mypy refuse to parse
# NumPy's stubs (they use `type` statements) and a parse error inside a dependency stops the whole
# analysis. Syntax newer than 3.10 is caught by ruff instead, which infers its target from
# `requires-python` (rule set `UP`).

# ---------------------------------------------------------------------------
# Commitizen
# ---------------------------------------------------------------------------
[tool.commitizen]
name = "cz_conventional_commits"
# The git tag is the only place a version exists -- setuptools_scm derives the package version from
# it, and `scm` makes Commitizen read it from there too. No version string is committed anywhere, so
# none can drift from the tag that built the wheel.
version_provider = "scm"
tag_format = "v$version"
annotated_tag = true
changelog_file = "CHANGELOG.md"
# The changelog IS the release notes: the publish workflow renders one version's section and posts it
# as the GitHub Release body, so a released version is never described in two places that disagree.
update_changelog_on_bump = true

# Conventional Commits' own changelog set: feat, fix, refactor, perf and breaking changes -- what a
# reader of this package gets that they did not have. `docs`, `test`, `ci` and `chore` are out. They
# could be let in, but only by shipping a Commitizen plugin to widen `commit_parser` (a class
# attribute, not a setting), and a package to maintain is a steep price for two more bullet points.
change_type_order = [
    "BREAKING CHANGE",
    "✨ Features",
    "🐛 Bug Fixes",
    "⚡ Performance",
    "♻️ Refactoring",
]

[tool.commitizen.change_type_map]
feat = "✨ Features"
fix = "🐛 Bug Fixes"
perf = "⚡ Performance"
refactor = "♻️ Refactoring"
