exclude: ^(?:\.pixi/|docs/_build/|dist/|.*\.egg-info/)

default_install_hook_types:
  - pre-commit
  - commit-msg

default_stages:
  - pre-commit

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: check-toml
      - id: check-xml
      - id: check-yaml
      - id: debug-statements
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: ^apps/mrsegmentator/README\.md$
      - id: mixed-line-ending
        exclude: ^apps/mrsegmentator/README\.md$
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^apps/mrsegmentator/README\.md$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.2
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        files: ^(konfai/|konfai-apps/konfai_apps/|konfai-mcp/konfai_mcp/|studio/konfai_studio/|tests/)
      - id: ruff-format
        files: ^(konfai/|konfai-apps/konfai_apps/|konfai-mcp/konfai_mcp/|studio/konfai_studio/|tests/)

  # mypy runs in the dev environment, where torch and the imaging stack are installed: the mirrors-mypy
  # hook type-checks in an environment of its own, without them, and reads every torch attribute as
  # Any | None. Same command as the pixi `typecheck` task and the CI job.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: pixi run --environment dev python -m mypy konfai konfai-apps/konfai_apps konfai-mcp/konfai_mcp studio/konfai_studio
        language: system
        pass_filenames: false
        files: ^(konfai/|konfai-apps/konfai_apps/|konfai-mcp/konfai_mcp/|studio/konfai_studio/)

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.6
    hooks:
      - id: bandit
        args: ["-r", "konfai", "konfai-apps/konfai_apps"]
        files: ^(konfai/|konfai-apps/konfai_apps/)
        exclude: ^(tests/|konfai-apps/tests/)
        pass_filenames: false

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.13.0
    hooks:
      - id: commitizen
        stages: [commit-msg]
