name: konfai_apps_ci

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/konfai_apps_ci.yml"
      - "konfai-apps/**"
      - "apps/**"
      - "konfai/**"
      - "tests/assets/Workflows/**"
      - "pyproject.toml"
      - "README.md"
  pull_request:
    paths:
      - ".github/workflows/konfai_apps_ci.yml"
      - "konfai-apps/**"
      - "apps/**"
      - "konfai/**"
      - "tests/assets/Workflows/**"
      - "pyproject.toml"
      - "README.md"
  schedule:
    - cron: "37 3 * * 1" # the full OS x Python matrix, weekly
  workflow_dispatch:

permissions:
  contents: read

# Only a pull request's runs share a group: a newer push cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  konfai_apps_ci:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      HUGGINGFACE_HUB_CACHE: ${{ github.workspace }}/.cache/huggingface/hub
      TRANSFORMERS_CACHE: ${{ github.workspace }}/.cache/huggingface/transformers

      HF_HUB_DOWNLOAD_TIMEOUT: "300"
      HF_HUB_ETAG_TIMEOUT: "60"

      HF_XET_HIGH_PERFORMANCE: "1"

      # A native crash (the macOS fine-tune SIGSEGV) prints every thread's Python stack.
      PYTHONFAULTHANDLER: "1"

      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HUGGINGFACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}

    strategy:
      fail-fast: false
      # Representative lanes on a pull request, the full matrix on main, weekly and by hand
      # (see konfai_ci.yml).
      matrix:
        os: >-
          ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "windows-latest", "macos-latest"]') }}
        python-version: ["3.11", "3.12", "3.13"]
        include: >-
          ${{ fromJSON(github.event_name == 'pull_request' && '[{"os": "windows-latest", "python-version": "3.12"}, {"os": "macos-latest", "python-version": "3.12"}]' || '[]') }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # This job runs code the pull request controls; the token has no business staying
          # in .git/config while it does.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install core package
        # Linux adds the CPU torch index: the default PyPI torch wheel bundles the multi-GB CUDA
        # stack a CPU-only runner never uses (macOS/Windows PyPI wheels are already CPU-only).
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]" ${{ runner.os == 'Linux' && '--extra-index-url https://download.pytorch.org/whl/cpu' || '' }}

      - name: Restore Hugging Face cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .cache/huggingface
          key: hf-apps-${{ runner.os }}

      - name: Install standalone apps package
        run: |
          pip install -e "./konfai-apps[server]"

      - name: Run apps tests
        run: |
          python -m pytest konfai-apps/tests

      - name: Install app bundles
        # From a checkout each bundle pins `konfai>=`/`konfai-apps>=` the closest release tag (`>=0.0`
        # in this tagless shallow clone), which the editable installs above satisfy.
        shell: bash
        run: |
          for app in apps/*/; do pip install -e "./$app"; done

      - name: Run app bundle tests
        # The five PyPI-published bundles. impact_reg's integration test gates itself
        # (KONFAI_IMPACTREG_REPO + fireants + CUDA) and skips here; its unit tests stub the runtime.
        shell: bash
        run: |
          for app in apps/*/; do python -m pytest -q "${app}tests"; done

      - name: Upload macOS crash reports
        # Last, so a crash in any test step above is caught: the native backtrace of a crashed
        # Python lives only in the runner's DiagnosticReports.
        if: failure() && runner.os == 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: crash-reports-${{ matrix.os }}-${{ matrix.python-version }}-${{ github.run_attempt }}
          path: ~/Library/Logs/DiagnosticReports/*.ips
          if-no-files-found: ignore

  impact_reg_engines:
    # The registration engines for real: one small registration per engine on the CPU, one end-to-end
    # 'register', and the published presets bound against the models (apps/impact_reg/tests/integration). The
    # bundle tests above stub the engines, which is how an itk-impact rename, a missing scipy and an elastix
    # binary that no longer loads beside the installed torch shipped. One Linux lane, not the matrix: itk-impact
    # has no macOS wheel, and fireants and the elastix-IMPACT binary are Linux-first.
    runs-on: ubuntu-latest
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HUGGINGFACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}
      # The tests fail rather than skip when an engine is missing.
      IMPACT_REG_ENGINE_TESTS: "1"
      # konfai-apps pip-installs a preset's requirements when it resolves one; this job installs them itself.
      KONFAI_APPS_INSTALL_REQUIREMENTS: "0"
      PYTHONFAULTHANDLER: "1"

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install KonfAI, konfai-apps, IMPACT-Reg and the engines
        # One resolution, so that itk-impact's torch pin picks the CPU wheel. fireants pins simpleitk==2.2.1,
        # which has no wheel for this Python: installed without its dependencies, as the app itself does, and
        # scipy, the one it imports beyond SimpleITK and torch, beside it.
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]" -e ./konfai-apps -e ./apps/impact_reg "itk-impact==0.1.6" scipy \
            --extra-index-url https://download.pytorch.org/whl/cpu
          pip install --no-deps fireants

      - name: Restore the elastix-IMPACT binary and the Hugging Face cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cache/konfai/elastix-impact
            .cache/huggingface
          key: impact-reg-engines-${{ hashFiles('apps/impact_reg/impact_reg_konfai/models/elastix_install.py') }}

      - name: Run the engine tests
        run: |
          python -m pytest -q -rs apps/impact_reg/tests/integration/test_engines_cpu.py \
            apps/impact_reg/tests/integration/test_preset_contract.py
