name: konfai_apps_ci

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/konfai_apps_ci.yml"
      - "konfai-apps/**"
      - "apps/**"
      - "konfai/**"
      - "tests/assets/Workflows/**"
      - "pyproject.toml"
      - "README.md"
  pull_request:
    paths:
      - ".github/workflows/konfai_apps_ci.yml"
      - "konfai-apps/**"
      - "apps/**"
      - "konfai/**"
      - "tests/assets/Workflows/**"
      - "pyproject.toml"
      - "README.md"

jobs:
  konfai_apps_ci:
    runs-on: ${{ matrix.os }}
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      HUGGINGFACE_HUB_CACHE: ${{ github.workspace }}/.cache/huggingface/hub
      TRANSFORMERS_CACHE: ${{ github.workspace }}/.cache/huggingface/transformers

      HF_HUB_DOWNLOAD_TIMEOUT: "300"
      HF_HUB_ETAG_TIMEOUT: "60"

      HF_HUB_ENABLE_HF_TRANSFER: "1"

      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HUGGINGFACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # This job runs code the pull request controls; the token has no business staying
          # in .git/config while it does.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install core package
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"

      - name: Restore Hugging Face cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .cache/huggingface
          key: hf-apps-${{ runner.os }}

      - name: Install standalone apps package
        run: |
          pip install -e ./konfai-apps

      - name: Run apps tests
        run: |
          python -m pytest -q konfai-apps/tests
