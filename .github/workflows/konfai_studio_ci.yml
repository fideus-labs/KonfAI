name: konfai_studio_ci

# konfai/** is here for the same reason konfai_mcp_ci.yml lists it: Studio's tests guard the wiring
# between Studio and the workflows, so a change confined to konfai/ is exactly what breaks them.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/konfai_studio_ci.yml"
      - "studio/**"
      - "konfai-mcp/**"
      - "konfai/**"
      - "pyproject.toml"
  pull_request:
    paths:
      - ".github/workflows/konfai_studio_ci.yml"
      - "studio/**"
      - "konfai-mcp/**"
      - "konfai/**"
      - "pyproject.toml"

jobs:
  konfai_studio_ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # studio/setup.py pins konfai-mcp to the setuptools_scm version -- tags must be reachable.
          fetch-depth: 0
          # PR CI runs untrusted build/test steps and never needs git auth.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            studio/pyproject.toml

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Build the Studio front
        # Vite emits into konfai_studio/web/ (vite.config.ts outDir); the trailing check keeps
        # test_serves_the_built_frontend from silently skipping if that output path ever drifts.
        run: |
          cd studio/frontend
          npm ci
          npm run build
          test -f ../konfai_studio/web/index.html

      - name: Install core package
        # The CPU torch index: the default PyPI torch wheel bundles the multi-GB CUDA stack this
        # CPU-only runner never uses.
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]" --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Install standalone apps package
        run: |
          pip install -e ./konfai-apps

      - name: Install standalone MCP package
        run: |
          pip install -e ./konfai-mcp

      - name: Install standalone Studio package
        run: |
          pip install -e ./studio

      - name: Build a throwaway studio wheel and verify it ships the front
        # The wheel is the only artifact that carries web/ (git-ignored, swept in by package-data),
        # so only inspecting a built wheel catches a packaging regression before release day.
        run: |
          python -m build --wheel studio
          python -c "
          import glob, sys, zipfile
          names = zipfile.ZipFile(glob.glob('studio/dist/*.whl')[0]).namelist()
          ok = 'konfai_studio/web/index.html' in names and any(n.startswith('konfai_studio/web/assets/') for n in names)
          sys.exit(0 if ok else 'the studio wheel is missing konfai_studio/web/index.html or assets/')
          "

      - name: Lint and format check
        run: |
          ruff check studio/konfai_studio
          ruff format --check studio/konfai_studio

      - name: Run studio tests
        run: |
          python -m pytest studio/tests
