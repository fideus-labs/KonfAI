name: publish

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install core package
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"

      - name: Install standalone apps package
        run: |
          pip install -e ./konfai-apps

      - name: Install standalone MCP package
        run: |
          pip install -e ./konfai-mcp

      - name: Run konfai tests
        run: |
          pytest -q tests

      - name: Run konfai-apps tests
        run: |
          python -m pytest -q konfai-apps/tests

      - name: Run konfai-mcp tests
        run: |
          python -m pytest -q konfai-mcp/tests

      - name: Install standalone Studio package
        run: |
          pip install -e ./studio

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build the Studio front
        # test_serves_the_built_frontend skips when web/index.html is absent -- build the front here
        # so the smoke test actually executes. The build job rebuilds it independently for the wheel.
        run: |
          cd studio/frontend
          npm ci
          npm run build
          test -f ../konfai_studio/web/index.html

      - name: Run konfai-studio tests
        run: |
          python -m pytest -q studio/tests

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: konfai
            pkg: "."
          - name: konfai-apps
            pkg: "konfai-apps"
          - name: konfai-mcp
            pkg: "konfai-mcp"
          - name: impact-synth-konfai
            pkg: "apps/impact_synth"
          - name: impact-seg-konfai
            pkg: "apps/impact_seg"
          - name: impact-reg-konfai
            pkg: "apps/impact_reg"
          - name: mrsegmentator-konfai
            pkg: "apps/mrsegmentator"
          - name: totalsegmentator-konfai
            pkg: "apps/totalsegmentator"
          # Studio ships a built React front (konfai_studio/web/*), so its front is built before packaging
          # and the wheel is built directly (--wheel): web/ is git-ignored, so the sdist file-finder would
          # drop it, but the wheel picks it up from package-data on disk.
          - name: konfai-studio
            pkg: "studio"
            build_args: "--wheel"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Set up Node
        if: matrix.name == 'konfai-studio'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build the Studio front
        if: matrix.name == 'konfai-studio'
        run: |
          cd studio/frontend
          npm ci
          npm run build

      - name: Build package
        run: |
          python -m pip install -U pip
          python -m pip install build setuptools-scm
          cd "${{ matrix.pkg }}"
          python -m build ${{ matrix.build_args }}

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: ${{ matrix.pkg }}/dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist_all

      - name: Flatten dists
        run: |
          mkdir -p dist
          find dist_all -type f \( -name "*.whl" -o -name "*.tar.gz" \) -print0 | xargs -0 -I {} cp {} dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  github_release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to create the release

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # cz renders a version's section from the history

      - uses: actions/download-artifact@v4
        with:
          path: dist_all

      - name: Flatten dists
        run: |
          mkdir -p dist
          find dist_all -type f \( -name "*.whl" -o -name "*.tar.gz" \) -print0 | xargs -0 -I {} cp {} dist/

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Commitizen
        run: python -m pip install commitizen==4.13.0

      # The release notes ARE the changelog section for this tag, rendered from the same commits the
      # committed CHANGELOG.md was generated from -- so the release page and the file cannot say
      # different things about one version.
      - name: Render the release notes for this tag
        run: cz changelog "${GITHUB_REF_NAME}" --file-name /tmp/release-notes.md

      - name: Create the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: /tmp/release-notes.md
          # A tag carrying a pre-release segment publishes as one, so `v1.8.0rc1` never lands on
          # users following the latest release.
          prerelease: ${{ contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'rc') || contains(github.ref_name, 'dev') }}
          files: dist/*
          fail_on_unmatched_files: false

  publish_docker:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Derive package version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Wait for PyPI release to be available
        run: |
          version="${{ steps.version.outputs.value }}"
          for attempt in $(seq 1 30); do
            if curl -fsSL "https://pypi.org/pypi/konfai/${version}/json" >/dev/null; then
              exit 0
            fi
            echo "konfai ${version} is not available on PyPI yet (attempt ${attempt}/30)"
            sleep 10
          done
          echo "konfai ${version} was not available on PyPI after 5 minutes"
          exit 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: vboussot/konfai
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            KONFAI_PYPI_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
