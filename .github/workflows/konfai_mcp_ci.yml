name: konfai_mcp_ci

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/konfai_mcp_ci.yml"
      - "konfai-mcp/**"
      - "konfai-apps/**"
      - "konfai/**"
      - "examples/**"
      - "pyproject.toml"
  pull_request:
    paths:
      - ".github/workflows/konfai_mcp_ci.yml"
      - "konfai-mcp/**"
      - "konfai-apps/**"
      - "konfai/**"
      - "examples/**"
      - "pyproject.toml"

permissions:
  contents: read

# Only a pull request's runs share a group: a newer push cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  konfai_mcp_ci:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # konfai-mcp bounds konfai, so the tag has to be reachable: without it setuptools_scm
          # builds the core package as 0.1.dev1 and no bound on it can hold.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            konfai-mcp/pyproject.toml

      - name: Install core package (with imaging backends)
        # The CPU torch index: the default PyPI torch wheel bundles the multi-GB CUDA stack this
        # CPU-only runner never uses.
        run: |
          python -m pip install -U pip
          pip install -e ".[dev,imaging]" --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Install standalone apps package
        run: |
          pip install -e ./konfai-apps

      - name: Install standalone MCP package
        run: |
          pip install -e ./konfai-mcp

      - name: Lint and format check
        run: |
          ruff check konfai-mcp/konfai_mcp
          ruff format --check konfai-mcp/konfai_mcp

      - name: Type-check with the MCP stack installed
        # The same command as the pixi `typecheck` task. konfai_ci's typecheck job installs neither
        # fastmcp nor fastapi, so their APIs are Any there. One lane, the typecheck job's 3.12: mypy
        # analyses as the interpreter it runs on.
        if: matrix.python-version == '3.12'
        run: python -m mypy konfai konfai-apps/konfai_apps konfai-mcp/konfai_mcp konfai-studio/konfai_studio

      - name: Build standalone MCP package
        run: |
          python -m build konfai-mcp

      - name: Smoke import
        run: |
          python -c "import konfai_mcp, konfai_mcp.server; print('konfai_mcp import OK')"

      - name: Run MCP tests
        run: |
          python -m pytest konfai-mcp/tests
