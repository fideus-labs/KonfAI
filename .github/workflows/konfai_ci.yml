name: konfai_ci

# config_guide and examples/Transform are sources here: the integration tests extract the YAML blocks
# from those pages and run the example's configs as shipped, so editing either is editing a fixture.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/konfai_ci.yml"
      - "konfai/**"
      - "konfai-apps/**"
      - "tests/**"
      - "docs/source/config_guide/**"
      - "examples/Transform/**"
      - "pyproject.toml"
      - "README.md"
  pull_request:
    paths:
      - ".github/workflows/konfai_ci.yml"
      - "konfai/**"
      - "konfai-apps/**"
      - "tests/**"
      - "docs/source/config_guide/**"
      - "examples/Transform/**"
      - "pyproject.toml"
      - "README.md"

jobs:
  konfai_ci:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # This job runs code the pull request controls; the token has no business staying
          # in .git/config while it does.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"

      - name: Run pytest
        run: |
          pytest -q tests

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # This job runs code the pull request controls; the token has no business staying
          # in .git/config while it does.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff==0.15.2

      - name: Run ruff lint
        run: ruff check konfai konfai-apps/konfai_apps tests

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # This job runs code the pull request controls; the token has no business staying
          # in .git/config while it does.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff==0.15.2

      - name: Check formatting
        run: ruff format --check konfai konfai-apps/konfai_apps tests

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # This job runs code the pull request controls; the token has no business staying
          # in .git/config while it does.
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        # The dev extra carries pytest + build; setuptools/setuptools-scm/wheel are the declared
        # build requirements the wheel test needs for a --no-isolation build.
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]" setuptools setuptools-scm wheel

      - name: Build sdist and wheel
        run: python -m build --sdist --wheel

      - name: Verify the wheel ships and installs the model catalog and the CLI
        # The wheel contract lives in one place: the slow tests build their own wheel, check it
        # against the source tree and install it NON-editable in a fresh venv (the test job's
        # editable install hides PEP 420/package-data breakage).
        run: pytest tests/unit/test_packaging.py -m slow

      - name: Upload wheel artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: konfai-wheel
          path: dist/*.whl
