name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scout:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check konfai_scout tests examples
      - run: ruff format --check konfai_scout tests examples
      # No API key anywhere in CI: the providers are exercised against fake clients, the loop with the mock model.
      - run: pytest -q
      - run: python examples/inspect_synthetic.py --max-tool-calls 12

  with-konfai:
    # The KonfAI Eval bridge, against the KonfAI branch that carries the registration criteria.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install "konfai[itk] @ git+https://github.com/fideus-labs/KonfAI@feat/scout" -e ".[dev]"
      - run: pytest -q tests/test_evaluation.py tests/test_agent.py
        env:
          OMP_NUM_THREADS: "1"
