[build-system]
requires = ["setuptools>=68", "wheel", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "konfai-mcp"
dynamic = ["version"]
description = "Standalone MCP server package for KonfAI experimentation workflows"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"

authors = [
  { name = "Valentin Boussot", email = "boussot.v@gmail.com" }
]

# konfai carries a bound because runner.py imports konfai.transformer at module scope: a 1.7.0
# satisfies a bare name, and the server then dies on import -- all of it, not just the transform
# tools. Spelled `>1.7.0` and not `>=1.8.0` so a source checkout satisfies it: setuptools_scm builds
# the unreleased tree as 1.7.1.devN, which PEP 440 sorts BELOW 1.7.1 and above 1.7.0.
# konfai-apps carries the same bound: its imports are lazy, so an older one does not break the server on
# import, it breaks one app tool at the call with an ImportError naming a symbol instead of a version.
dependencies = [
  "konfai>1.7.0",
  "konfai-apps>1.7.0",
  "fastmcp",
  "ruamel.yaml",
  "numpy"
]

[project.urls]
Homepage = "https://github.com/fideus-labs/KonfAI"
Repository = "https://github.com/fideus-labs/KonfAI"
Issues = "https://github.com/fideus-labs/KonfAI/issues"
License = "https://www.apache.org/licenses/LICENSE-2.0"

[project.scripts]
konfai-mcp = "konfai_mcp:main"

[tool.setuptools_scm]
root = ".."
tag_regex = "^v(?P<version>.*)$"
local_scheme = "no-local-version"

[tool.setuptools.packages.find]
include = ["konfai_mcp*"]
