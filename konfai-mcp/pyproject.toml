[build-system]
requires = ["setuptools>=68", "wheel", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "konfai-mcp"
dynamic = ["version", "dependencies"]
description = "Standalone MCP server package for KonfAI experimentation workflows"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"

authors = [
  { name = "Valentin Boussot", email = "boussot.v@gmail.com" }
]

# Dependencies live in setup.py: konfai and konfai-apps are pinned to the exact scm-derived release
# version there, like every other member of the lockstep family.

[project.urls]
Homepage = "https://github.com/fideus-labs/KonfAI"
Repository = "https://github.com/fideus-labs/KonfAI"
Issues = "https://github.com/fideus-labs/KonfAI/issues"
License = "https://www.apache.org/licenses/LICENSE-2.0"

[project.scripts]
konfai-mcp = "konfai_mcp:main"

[tool.setuptools_scm]
root = ".."
tag_regex = "^v(?P<version>.*)$"
local_scheme = "no-local-version"

[tool.setuptools.packages.find]
include = ["konfai_mcp*"]
